<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph image</title>
<style>
@font-face { font-family: "Geist"; src: url("fonts/geist.woff2") format("woff2"); font-weight: 400 700; }
body { margin: 0; }
.og {
  width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px;
  background: #0A0A0B; color: #F5F5F7; font-family: "Geist", sans-serif;
  display: flex; flex-direction: column; justify-content: space-between;
}
p, h1 { margin: 0; }
.top { font-size: 24px; color: #98989D; }
h1 { font-size: 116px; line-height: 0.95; letter-spacing: -0.045em; font-weight: 600; }
.line { margin-top: 28px; font-size: 40px; line-height: 1.2; letter-spacing: -0.02em; }
.foot { display: flex; gap: 48px; align-items: baseline; border-top: 1px solid #48484C; padding-top: 28px; font-size: 24px; color: #C7C7CC; }
.foot b { color: #F5F5F7; font-weight: 600; }
</style>
</head>
<body>
<div class="og">
<p class="top">Vancouver, BC · Founder, Hanzo Technologies</p>
<div>
<h1>Quielo Rodriguez</h1>
<p class="line">iOS and identity engineer. Founder of Hanzo.</p>
</div>
<div class="foot">
<span><b>Hanzo Health</b> live on the App Store</span>
<span>Open to iOS and identity roles</span>
</div>
</div>
</body>
</html>
